{{ define "main" }}
<article class="posts-article docs-article">
    <div class="post-header">
        <h1>{{ .Title }}</h1>
        <div class="post-meta">
            <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
            {{ with .Params.tags }}
            <span class="post-tags">
                {{ range . }}<span class="post-tag">{{ . }}</span>{{ end }}
            </span>
            {{ end }}
        </div>
        
        {{ with .Description }}<p class="post-lead">{{ . }}</p>{{ end }}
    </div>

    {{ .Content }}
</article>
{{ end }}
