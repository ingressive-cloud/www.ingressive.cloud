<!DOCTYPE html>
<html lang="{{ site.Language.Lang | default "en" }}">
<head>
{{ partial "head.html" . }}
<link rel="stylesheet" href="/docs.css">
</head>
<body class="docs-body">
    <canvas id="globe-bg"></canvas>
    {{ partial "header.html" . }}

    <div class="posts-layout">
        <main class="posts-main">
            {{ block "main" . }}{{ end }}
        </main>
    </div>

    {{ partial "footer.html" . }}

    {{ partial "search-overlay.html" . }}

    <script>
        // TOC scroll spy
        const tocLinks = document.querySelectorAll('.docs-toc a');
        if (tocLinks.length > 0) {
            const headings = Array.from(tocLinks).map(l => document.getElementById(l.getAttribute('href').slice(1))).filter(Boolean);
            const observer = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        tocLinks.forEach(l => l.classList.remove('active'));
                        const active = document.querySelector(`.docs-toc a[href="#${entry.target.id}"]`);
                        if (active) active.classList.add('active');
                    }
                });
            }, { rootMargin: '-80px 0px -60% 0px', threshold: 0 });
            headings.forEach(h => observer.observe(h));
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7/dist/fuse.min.js"></script>
    <script src="/docs-search.js"></script>
    <script src="/script.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
