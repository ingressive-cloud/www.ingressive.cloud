server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    location = /discord {
        return 302 https://discord.gg/TrUjN7gbWz;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    error_page 500 502 503 504 /50x.html;
}
